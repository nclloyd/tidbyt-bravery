name: Daily Bravery Mission

on:
  schedule:
    # GitHub can delay or entirely skip scheduled runs on lower-traffic repos,
    # so we give it many chances across a 6:00-7:30am ET window instead of a
    # single exact shot. The "Skip if already advanced today" step means only
    # the first one to actually fire each day does real work; the rest no-op.
    - cron: '0,15,30,45 10 * * *'   # 6:00-6:45am EDT
    - cron: '0,15,30 11 * * *'      # 7:00-7:30am EDT / 6:00-6:30am EST
    - cron: '45 11 * * *'           # 6:45am EST
    - cron: '0,15,30 12 * * *'      # 7:00-7:30am EST
  workflow_dispatch: {}              # allows manual "Run workflow" testing any time
  repository_dispatch:
    types: [advance-mission]         # fired precisely by an iOS Personal Automation at 6am ET,
                                      # since GitHub's own scheduler delays this repo by hours

permissions:
  contents: write

jobs:
  advance-mission:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Skip if already advanced today
        if: github.event_name == 'schedule'
        working-directory: mission
        run: |
          TODAY=$(TZ="America/New_York" date +%Y-%m-%d)
          LAST=$(jq -r '.lastAdvanced // ""' mission_queue.json)
          if [ "$TODAY" == "$LAST" ]; then
            echo "Already advanced today ($TODAY) — this is the duplicate DST trigger (or a late-firing repeat), skipping."
            echo "SKIP=true" >> "$GITHUB_ENV"
          else
            echo "Not yet advanced today (today=$TODAY, last=$LAST) — proceeding regardless of what hour this actually fired."
          fi

      - name: Install pixlet
        if: env.SKIP != 'true'
        working-directory: mission
        run: |
          curl -sL -o pixlet.tar.gz https://github.com/tidbyt/pixlet/releases/download/v0.34.0/pixlet_0.34.0_linux_amd64.tar.gz
          tar -xzf pixlet.tar.gz
          chmod +x pixlet

      - name: Advance the mission queue
        if: env.SKIP != 'true'
        working-directory: mission
        run: |
          CURRENT=$(jq -r '.current' mission_queue.json)
          COMPLETED=$(jq -r '.completed' mission_queue.json)

          # Re-queue yesterday's mission if it wasn't completed
          if [ "$CURRENT" != "null" ] && [ "$COMPLETED" != "true" ]; then
            jq --arg c "$CURRENT" '.queue += [$c]' mission_queue.json > tmp.json && mv tmp.json mission_queue.json
            echo "Re-queued (not completed): $CURRENT"
          else
            echo "Retired (completed or first run): $CURRENT"
          fi

          # Refill from the master bank if the queue has run dry
          QUEUE_LEN=$(jq '.queue | length' mission_queue.json)
          if [ "$QUEUE_LEN" -eq 0 ]; then
            echo "Queue empty — refilling from mission_bank.json"
            jq -s '.[1].challenges as $bank | .[0].queue = $bank | .[0]' mission_queue.json mission_bank.json > tmp.json && mv tmp.json mission_queue.json
          fi

          # Pop the front of the queue as today's mission
          NEW_CURRENT=$(jq -r '.queue[0]' mission_queue.json)
          TODAY=$(TZ="America/New_York" date +%Y-%m-%d)
          jq --arg nc "$NEW_CURRENT" --arg today "$TODAY" \
            '.current = $nc | .completed = false | .queue = .queue[1:] | .lastAdvanced = $today' \
            mission_queue.json > tmp.json && mv tmp.json mission_queue.json
          echo "Today's mission: $NEW_CURRENT"
          echo "MISSION=$NEW_CURRENT" >> "$GITHUB_ENV"

      - name: Render and push to Tidbyt
        if: env.SKIP != 'true'
        working-directory: mission
        env:
          TIDBYT_API_TOKEN: ${{ secrets.TIDBYT_API_TOKEN }}
          TIDBYT_DEVICE_ID: inductively-enormous-plausible-waterbuck-668
        run: |
          ./pixlet render mission.star -o mission.webp challenge="$MISSION" done="false"
          B64=$(base64 -w0 mission.webp)
          cat > push_body.json <<EOF
          {"deviceID":"$TIDBYT_DEVICE_ID","image":"$B64","installationID":"mission","background":false}
          EOF
          curl -s -w "\nHTTP_STATUS=%{http_code}\n" -X POST "https://api.tidbyt.com/v0/devices/$TIDBYT_DEVICE_ID/push" \
            -H "Authorization: Bearer $TIDBYT_API_TOKEN" \
            -H "Content-Type: application/json" \
            --data @push_body.json
          rm -f push_body.json mission.webp

      - name: Commit updated queue
        if: env.SKIP != 'true'
        working-directory: mission
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add mission_queue.json
          git diff --cached --quiet && echo "No change" && exit 0
          git commit -m "Daily mission: $MISSION"
          git push
